spring.application.name=Projeto-Mandabaa
server.port=8080

# Banco de dados PostgreSQL rodando no Docker (ver docker-compose.yml)
spring.datasource.url=jdbc:postgresql://localhost:5432/mandabaa_db
spring.datasource.username=postgres
spring.datasource.password=postgrespassword
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate: cria e atualiza as tabelas automaticamente a partir das entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Quando a Pessoa 3 criar o arquivo src/main/resources/data.sql com dados de demonstracao,
# basta trocar "never" por "always" na linha abaixo.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never
