spring.application.name=Projeto-Mandabaa
server.port=8080

# Configuracoes de Banco de Dados PostgreSQL (Docker)
spring.datasource.url=jdbc:postgresql://localhost:5432/mandabaa_db
spring.datasource.username=postgres
spring.datasource.password=postgrespassword
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuracoes JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Execucao do data.sql na inicializacao
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
