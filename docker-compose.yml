services:
  postgres-mandabaa:
    image: postgres:15-alpine
    container_name: postgres-mandabaa
    environment:
      POSTGRES_DB: mandabaa_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_data:
